<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alterar Cadastro</title>
  <link rel="icon" type="image/x-icon" href="img/topeira_samurai.png">
 
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tiny5&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="css/cadastro.css">
</head>
<body>
    <main>
        <div class="box"> 
            <h1>Troca de Daimio</h1>
            <form action="principal.html" method="GET">
                <div class="form-group">
                    <label for="nome">Novo Nome:</label>
                    <input type="text" id="nome" name="nome" placeholder="Digite seu novo nome">
                </div>
                <div class="form-group">
                    <label for="telefone">Novo Telefone:</label>
                    <input type="text" id="telefone" name="telefone" placeholder="Digite seu novo telefone">
                </div>
                <div class="form-group">
                    <label for="email">E-mail:</label>
                    <input type="text" id="email" name="email" placeholder="Digite seu novo e-mail">
                </div>
                <div class="form-group">
                    <label for="senha">Nova Senha:</label>
                    <input type="text" id="senha" name="senha" placeholder="Digite sua nova senha">
                </div>
                <button type="submit">Realizar Alteração</button>
            </form>
            <p style="text-align: center; margin-top: 20px;">
                <a href="principal.html" style="color: white; font-weight: bold;">Voltar para principal</a>
            </p>
        </div>
    </main>
</body>
</html>

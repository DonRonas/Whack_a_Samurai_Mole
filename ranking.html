<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ranking Global</title>
    <link rel="icon" type="image/x-icon" href="img/topeira_samurai.png">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tiny5&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/ranking.css">
</head>
<body>
    <header>
        <h1>Whack a Samurai Mole</h1>
    </header>
    
    <main>
        <div class="box">
            <h2>Halls da Fama</h2>
            
            <div class="tabela-container">
                <div class="grid-ranking">
                    <!-- Cabeçalho -->
                    <div class="linha-cabecalho">
                        <div class="celula">Pos</div>
                        <div class="celula">Samurai</div>
                        <div class="celula">Modo</div>
                        <div class="celula">Nível</div>
                        <div class="celula">Pontos</div>
                    </div>

                    <!-- Ouro -->
                    <div class="linha-dados top1">
                        <div class="celula">1º</div>
                        <div class="celula">ShadowNinja99</div>
                        <div class="celula">Explosivo</div>
                        <div class="celula">15</div>
                        <div class="celula">342</div>
                    </div>

                    <!-- Prata -->
                    <div class="linha-dados top2">
                        <div class="celula">2º</div>
                        <div class="celula">RoninDestroyer</div>
                        <div class="celula">Clássico</div>
                        <div class="celula">12</div>
                        <div class="celula">280</div>
                    </div>

                    <!-- Bronze -->
                    <div class="linha-dados top3">
                        <div class="celula">3º</div>
                        <div class="celula">KatanaMaster</div>
                        <div class="celula">Explosivo</div>
                        <div class="celula">10</div>
                        <div class="celula">195</div>
                    </div>

                    <!-- Restante -->
                    <div class="linha-dados">
                        <div class="celula">4º</div>
                        <div class="celula">YakuzaMole</div>
                        <div class="celula">Clássico</div>
                        <div class="celula">8</div>
                        <div class="celula">150</div>
                    </div>

                    <div class="linha-dados">
                        <div class="celula">5º</div>
                        <div class="celula">NoobSamurai</div>
                        <div class="celula">Explosivo</div>
                        <div class="celula">3</div>
                        <div class="celula">42</div>
                    </div>
                </div>
            </div>

            <p class="acoes">
                <a href="principal.html" class="link-voltar">Voltar para o Menu</a>
            </p>
        </div>
    </main>
</body>
</html>

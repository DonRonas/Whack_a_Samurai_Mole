<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Interface do Jogo</title>
  <link rel="stylesheet" href="css/principal.css">
</head>
<body>

    <div class="interface_jogo">
    <aside>

            <h2>MENU</h2>
            <nav>
                <ol>
                    <li>Jogar</li>
                    <li>Skins</li>
                    <li>Bestiario</li>
                    <li>Loja de pontos</li>
                    <li>Ranking</li>
                    <li>Historico</li>
                    <li>Configurações</li>
                    <li><a href="inicial.html">Sair</a></li>
                    <li>Creditos</li>
                    </ol>
            </nav>
    </aside>
    <main>

        <header class="status">
            <div class="status-left">
                <p>Nivel:100</p>
                <p>Time:59</p>
            </div>

            <div class="status-right">
                <p>Score:1000</p>
                <p>Kill:346</p>
            </div>
        </header>

        <section class="tabuleiro">
            <div class="container_tabuleiro">
                <img src="img/tabuleiro.jpeg" alt="tabuleiro">
            </div>
        </section>

        <section class="progresso">
            <progress value="50" max="100"></progress>
        </section>

        <footer>
            <p>SEPPUKU</p>
        </footer>

    </main>

    </div>

</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interface do Jogo</title>
</head>
<body>

    <div class="interface_jogo">
    <aside>

            <h2>MENU</h2>
            <ol>
                <li>Jogar</li>
                <li>Skins</li>
                <li>Bestiario</li>
                <li>Loja de pontos</li>
                <li>Ranking</li>
                <li>Historico</li>
                <li>Configurações</li>
                <li>Sair</li>
                <li>Creditos</li>
            </ol>

    </aside>
    <main>

        <header class="status">
            <div class="status-left">
                <p>Nivel</p>
                <p>Time</p>
            </div>

            <div class="status-right">
                <p>Score</p>
                <p>Kill</p>
            </div>
        </header>

        <section class="tabuleiro">
            <div class="container_tabuleiro">
                <img src="img/tabuleiro.jpeg" alt="tabuleiro">
            </div>
        </section>

        <section class="progresso">
            <progress value="50" max="100"></progress>
        </section>

        <footer>
            <p>SEPPUKU</p>
        </footer>

    </main>

    </div>

</body>
</html>

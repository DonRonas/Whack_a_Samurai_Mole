<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alterar Cadastro</title>
  <link rel="icon" type="image/x-icon" href="../img/topeira_samurai.png">
  <script src="../js/storage.js"></script>
  <script>Armazenamento.exigirLogin();</script>
 
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tiny5&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="../css/cadastro.css">
</head>
<body>
    <main>
        <div class="box"> 
            <h1>Troca de Daimio</h1>
            <form id="form-alteracao">
                <div class="form-group">
                    <label for="username">Username:</label>
                    <input type="text" id="username" disabled>
                </div>
                <div class="form-group">
                    <label for="cpf">CPF:</label>
                    <input type="text" id="cpf" disabled>
                </div>
                <div class="form-group">
                    <label for="nascimento">Data de Nascimento:</label>
                    <input type="date" id="nascimento" disabled>
                </div>
                <div class="form-group">
                    <label for="nome">Novo Nome:</label>
                    <input type="text" id="nome" name="nome" placeholder="Digite seu novo nome" required>
                </div>
                <div class="form-group">
                    <label for="telefone">Novo Telefone:</label>
                    <input type="text" id="telefone" name="telefone" placeholder="Digite seu novo telefone" required>
                </div>
                <div class="form-group">
                    <label for="email">E-mail:</label>
                    <input type="text" id="email" name="email" placeholder="Digite seu novo e-mail" required>
                </div>
                <div class="form-group">
                    <label for="senha">Nova Senha:</label>
                    <input type="password" id="senha" name="senha" placeholder="Deixe em branco para manter a atual" autocomplete="new-password">
                </div>
                <p id="mensagem-form" role="alert" style="text-align: center; min-height: 1.2em;"></p>
                <button type="submit">Realizar Alteração</button>
            </form>
            <p style="text-align: center; margin-top: 20px;">
                <a href="principal.html" style="color: white; font-weight: bold;">Voltar para principal</a>
            </p>
        </div>
    </main>

    <script src="../js/auth.js"></script>
</body>
</html>

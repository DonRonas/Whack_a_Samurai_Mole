<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Whack-a-Mole-Samurai</title>
        <link rel="icon" type="image/x-icon" href="../img/topeira_icone.png">
        
        <link rel="stylesheet" href="../css/inicial.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Tiny5&display=swap" rel="stylesheet">
    </head>
    <body>

        <main>
            <img src="../img/topeira_icone.png" alt="imagem de topeira samurai" width="350" height="250">

            <form id="form-login">
                <div class="campo">
                    <label for="usuario">Usuario:</label>
                    <input type="text" id="usuario" name="usuario" placeholder="digite seu nome de usuario" required autocomplete="username">
                </div>
        
                <div class="campo">
                    <label for="senha">Senha:</label>
                    <input type="password" id="senha" name="senha" placeholder="digite sua senha" required autocomplete="current-password">
                </div>
                <p id="mensagem-form" role="alert" style="text-align: center; min-height: 1.2em;"></p>
                <button type="submit" style="font-family: 'Tiny5', sans-serif, serif;">ENTRAR</button>
            </form>
            <p><a href="cadastro.html">Não tem cadastro? Cadastre-se aqui</a></p>
        </main>

        <script src="../js/storage.js"></script>
        <script src="../js/auth.js"></script>
    </body>
    
</html>

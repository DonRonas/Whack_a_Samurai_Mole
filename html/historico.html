<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Histórico de Partidas</title>
    <link rel="icon" type="image/x-icon" href="../img/topeira_samurai.png">
    <script src="../js/storage.js"></script>
    <script>Armazenamento.exigirLogin();</script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tiny5&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="../css/historico.css">
</head>
<body>
    <header>
        <h1>Whack a Mole Samurai</h1>
    </header>
    
    <main>
        <div class="box">
            <h2>Histórico de Partidas</h2>
            
            <div class="tabela-container">
                <div class="grid-historico" id="grid-historico"></div>
            </div>

            <p class="acoes">
                <a href="principal.html" class="link-voltar">Voltar ao Jogo</a>
            </p>
        </div>
    </main>

    <script>
        (() => {
            const grid = document.getElementById('grid-historico');
            const COLUNAS = 7;
            const colunasCss = 'repeat(' + COLUNAS + ', 1fr)';

            function linha(classe, textos) {
                const l = document.createElement('div');
                l.className = classe;
                l.style.gridTemplateColumns = colunasCss; // 7 colunas, independente do CSS
                for (const t of textos) {
                    const c = document.createElement('div');
                    c.className = 'celula';
                    c.textContent = t;
                    l.appendChild(c);
                }
                grid.appendChild(l);
            }

            linha('linha-cabecalho', ['Data/Hora', 'Jogador', 'Modo', 'Grade', 'Nível', 'Acertos', 'Pontos']);

            const partidas = Armazenamento.historicoDoUsuario();
            if (partidas.length === 0) {
                const vazio = document.createElement('p');
                vazio.textContent = 'Nenhuma partida jogada ainda.';
                vazio.style.textAlign = 'center';
                grid.appendChild(vazio);
                return;
            }

            for (const p of partidas) {
                linha('linha-dados', [
                    Armazenamento.formatarData(p.data),
                    p.usuario,
                    Armazenamento.rotuloModo(p),
                    p.tamanho + 'x' + p.tamanho,
                    p.nivel,
                    p.acertos,
                    p.pontos,
                ]);
            }
        })();
    </script>
</body>
</html>

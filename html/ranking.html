<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ranking Global</title>
    <link rel="icon" type="image/x-icon" href="../img/topeira_samurai.png">
    <script src="../js/storage.js"></script>
    <script>Armazenamento.exigirLogin();</script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tiny5&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../css/ranking.css">
</head>
<body>
    <header>
        <h1>Whack a Mole Samurai</h1>
    </header>
    
    <main>
        <div class="box">
            <h2>Ranking Global</h2>
            
            <div class="tabela-container">
                <div class="grid-ranking" id="grid-ranking">
                    <!-- Cabeçalho -->
                    <div class="linha-cabecalho">
                        <div class="celula">Pos</div>
                        <div class="celula">Samurai</div>
                        <div class="celula">Modo</div>
                        <div class="celula">Nível</div>
                        <div class="celula">Pontos</div>
                    </div>
                </div>
            </div>

            <p class="acoes">
                <a href="principal.html" class="link-voltar">Voltar para o Menu</a>
            </p>
        </div>
    </main>

    <script>
        (() => {
            const grid = document.getElementById('grid-ranking');
            const melhores = Armazenamento.ranking(10); // melhor partida de cada jogador

            if (melhores.length === 0) {
                const vazio = document.createElement('p');
                vazio.textContent = 'Nenhuma partida registrada ainda.';
                vazio.style.textAlign = 'center';
                grid.appendChild(vazio);
                return;
            }

            melhores.forEach((p, i) => {
                const l = document.createElement('div');
                l.className = 'linha-dados' + (i < 3 ? ' top' + (i + 1) : '');
                const textos = [(i + 1) + 'º', p.usuario, Armazenamento.rotuloModo(p), p.nivel, p.pontos];
                for (const t of textos) {
                    const c = document.createElement('div');
                    c.className = 'celula';
                    c.textContent = t;
                    l.appendChild(c);
                }
                grid.appendChild(l);
            });
        })();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Histórico de Partidas</title>
    <link rel="icon" type="image/x-icon" href="img/topeira_samurai.png">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tiny5&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="css/historico.css">
</head>
<body>
    <header>
        <h1>Whack a Mole Samurai</h1>
    </header>
    
    <main>
        <div class="box">
            <h2>Histórico de Partidas</h2>
            
            <div class="tabela-container">
                <div class="grid-historico">
                    <!-- Cabeçalho -->
                    <div class="linha-cabecalho">
                        <div class="celula">Data/Hora</div>
                        <div class="celula">Modo</div>
                        <div class="celula">Grade</div>
                        <div class="celula">Nível</div>
                        <div class="celula">Pontos</div>
                        <div class="celula">Tempo</div>
                    </div>

                    <!-- Linhas de Dados -->
                    <div class="linha-dados">
                        <div class="celula">22/09/2026 14:30</div>
                        <div class="celula">Explosivo</div>
                        <div class="celula">4x4</div>
                        <div class="celula">8</div>
                        <div class="celula">142</div>
                        <div class="celula">02:00</div>
                    </div>

                    <div class="linha-dados">
                        <div class="celula">21/09/2026 18:15</div>
                        <div class="celula">Clássico</div>
                        <div class="celula">6x6</div>
                        <div class="celula">5</div>
                        <div class="celula">89</div>
                        <div class="celula">01:57</div>
                    </div>

                    <div class="linha-dados">
                        <div class="celula">20/09/2026 20:00</div>
                        <div class="celula">Explosivo</div>
                        <div class="celula">4x4</div>
                        <div class="celula">3</div>
                        <div class="celula">35</div>
                        <div class="celula">01:48</div>
                    </div>

                    <div class="linha-dados">
                        <div class="celula">19/09/2026 11:45</div>
                        <div class="celula">Clássico</div>
                        <div class="celula">8x8</div>
                        <div class="celula">12</div>
                        <div class="celula">210</div>
                        <div class="celula">01:45</div>
                    </div>
                </div>
            </div>

            <p class="acoes">
                <a href="principal.html" class="link-voltar">Voltar ao Jogo</a>
            </p>
        </div>
    </main>
</body>
</html>

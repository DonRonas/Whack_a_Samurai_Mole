<!DOCTYPE html>
<html>
    <head>
        <title>Whack-a-Mole-Samurai</title>
        <link rel="icon" type="image/x-icon" href="img/topeira_icone.png" alt="icone do site">
        
        <link rel="stylesheet" href="css/inicial.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Tiny5&display=swap" rel="stylesheet">
    </head>
    <body>

        <main>
            <img src="img/topeira_samurai.png" alt="imagem de topeira samurai" width="350px" height="250px">

            <form action="principal.html" method="GET">
                <div class="campo">
                    <label for="usuario">Usuario:</label>
                    <input type="text" id="usuario" name="usuario" placeholder="digite seu nome de usuario" required>
                </div>
        
                <div class="campo">
                    <label for="senha">Senha:</label>
                    <input type="text" id="senha" name="senha" placeholder="digite sua senha" required>
                </div>
                <button type="submit" style="font-family: 'Tiny5', sans-serif, serif;">ENTRAR</button>
            </form>
            <p><a href="cadastro.html">Não tem cadastro? Cadastre-se aqui</a></p>
        </main>
    </body>
    
</html>
